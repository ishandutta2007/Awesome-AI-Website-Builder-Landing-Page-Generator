<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }

      /* Dynamic Animations (Background Ambient Only - Foreground Stays Crisp) */
      @keyframes pulseGlow1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.35; }
        50% { transform: translate(40px, -20px) scale(1.15); opacity: 0.6; }
      }
      @keyframes pulseGlow2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.3; }
        50% { transform: translate(-30px, 25px) scale(1.2); opacity: 0.55; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes scanDash {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      .glow-orb-1 {
        animation: pulseGlow1 8s ease-in-out infinite;
        transform-origin: center;
      }
      .glow-orb-2 {
        animation: pulseGlow2 10s ease-in-out infinite;
        transform-origin: center;
      }
      .float-card-1 {
        animation: floatSlow1 5s ease-in-out infinite;
      }
      .float-card-2 {
        animation: floatSlow2 6s ease-in-out infinite;
      }
      .animated-wireframe {
        stroke-dasharray: 8 6;
        animation: scanDash 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND ELEMENTS: Glowing Orbs (Safely placed behind content) -->
  <g opacity="0.8">
    <circle cx="220" cy="110" r="130" fill="#38bdf8" filter="url(#glowCyan)" class="glow-orb-1" />
    <circle cx="980" cy="280" r="150" fill="#a855f7" filter="url(#glowPurple)" class="glow-orb-2" />
    <circle cx="600" cy="380" r="100" fill="#ec4899" filter="url(#glowCyan)" class="glow-orb-1" />
  </g>

  <!-- DYNAMIC AMBIENT CARD 1: Code / Prompt Box (Floating gently on right) -->
  <g class="float-card-1" transform="translate(800, 50)" opacity="0.85">
    <rect width="340" height="135" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2" />
    <circle cx="24" cy="22" r="5" fill="#ef4444" />
    <circle cx="40" cy="22" r="5" fill="#f59e0b" />
    <circle cx="56" cy="22" r="5" fill="#10b981" />
    <text x="80" y="26" font-family="monospace" font-size="11" fill="#64748b">prompt-to-landing-page.ts</text>
    <text x="24" y="60" font-family="monospace" font-size="13" fill="#38bdf8">&gt; const</text>
    <text x="85" y="60" font-family="monospace" font-size="13" fill="#e2e8f0">site = await ai.build({</text>
    <text x="44" y="84" font-family="monospace" font-size="12" fill="#94a3b8">theme: "modern-saas",</text>
    <text x="44" y="104" font-family="monospace" font-size="12" fill="#34d399">speed: "instant", deploy: true</text>
    <text x="24" y="124" font-family="monospace" font-size="13" fill="#e2e8f0">});</text>
  </g>

  <!-- DYNAMIC AMBIENT CARD 2: Analytics / Generator Status (Floating bottom right) -->
  <g class="float-card-2" transform="translate(830, 215)" opacity="0.85">
    <rect width="310" height="150" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
    <!-- Mini UI elements -->
    <rect x="20" y="20" width="80" height="18" rx="9" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8" />
    <text x="32" y="33" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34d399">● LIVE 99.9%</text>
    <text x="115" y="33" font-family="sans-serif" font-size="11" fill="#cbd5e1">20+ AI Models Supported</text>

    <!-- Animated UI Wireframe Flow -->
    <rect x="20" y="55" width="270" height="26" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1" class="animated-wireframe" />
    <text x="32" y="72" font-family="monospace" font-size="11" fill="#93c5fd">bolt.diy • OpenPage • GrapesJS</text>
    
    <rect x="20" y="95" width="125" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="32" y="112" font-family="sans-serif" font-size="10" fill="#94a3b8">Avg Gen Speed</text>
    <text x="32" y="127" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">&lt; 30 Seconds</text>

    <rect x="155" y="95" width="135" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="167" y="112" font-family="sans-serif" font-size="10" fill="#94a3b8">Self-Hostable</text>
    <text x="167" y="127" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a78bfa">100% Open Source</text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, Highlights (Guaranteed clear foreground) -->
  <g transform="translate(70, 75)">
    <!-- Top Pill -->
    <g>
      <rect width="270" height="32" rx="16" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="1.2" />
      <text x="18" y="21" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">⚡ CURATED COMMUNITY DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text" fill="url(#titleGrad)">Awesome AI Website Builder</text>
    <text x="0" y="135" class="title-text" fill="#f8fafc">&amp; Landing Page Generator 🌟</text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle-text">
      The ultimate open-source index of prompt-to-site builders, visual editors,
    </text>
    <text x="0" y="206" class="subtitle-text">
      Next.js landing templates, and self-hostable Webflow / Framer alternatives.
    </text>

    <!-- Feature Pills / Badges in Foreground -->
    <g transform="translate(0, 245)">
      <!-- Pill 1 -->
      <g>
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
        <text x="18" y="22" class="badge-text">🚀 Open Source</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
        <text x="18" y="22" class="badge-text">🤖 Multi-LLM</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(290, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
        <text x="18" y="22" class="badge-text">📦 Self-Hostable</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(445, 0)">
        <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
        <text x="18" y="22" class="badge-text">📊 Market Insights</text>
      </g>
    </g>
  </g>

  <!-- Decorative Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
</svg>